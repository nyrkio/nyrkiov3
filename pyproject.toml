[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nyrkiov3"
version = "0.0.1"
description = "Nyrkiö v3: benchmark ingest, change detection, and query service."
# Runs on CPython 3.12. (Benchmark logs are parsed in parallel via
# ThreadPoolExecutor; a later move to the free-threaded 3.14 build would
# let those threads run truly concurrently.)
requires-python = "==3.12.*"
# Production dependencies: the PLATFORM and the benchmark parsers, only.
#  - jsonee owns config, the store, the ASGI server (uvicorn) and the
#    data vocabulary, so purejson/extjson/uvicorn are all transitive via
#    jsonee (jsonee -> purejson -> extjson). The app imports Document and
#    the extjson codec directly, but doesn't re-declare what the platform
#    already guarantees.
#  - benchzoo provides the benchmark-format parsers (nyrkio-sync backfill).
#  - AuroraBorealis is a JS UI library served as static assets
#    (--aurora-dir), NOT a Python dependency.
# Editable local checkouts for development live in requirements-dev.txt.
dependencies = [
    "jsonee",
    "benchzoo",
]

[project.optional-dependencies]
# Test tooling only. Editable sibling checkouts are NOT here — a PEP 508
# extra can't express `-e`, and keeping the prod manifest free of local
# paths is the whole point. Use requirements-dev.txt for those.
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

# The backing libraries aren't on PyPI. For PRODUCTION, source them from
# GitHub by uncommenting the block below (uv pins the resolved commit in
# uv.lock for reproducible deploys). jsonee carries purejson/extjson via
# its own sources, so nyrkiov3 only needs jsonee + benchzoo here.
# For LOCAL development with editable sibling checkouts, use instead:
#     uv pip install -e . -r requirements-dev.txt
#[tool.uv.sources]
#jsonee   = { git = "https://github.com/nyrkio/jsonee",   branch = "main" }
#benchzoo = { git = "https://github.com/nyrkio/benchzoo", branch = "main" }

[project.scripts]
nyrkio-sync = "nyrkiov3.cli:main"
nyrkio-serve = "nyrkiov3.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
